<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IamNotOst — personal page">
    <title>IamNotOst</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="noise"></div>
    <div class="glow"></div>

    <header class="topbar">
        <div class="brand" data-i18n="brand">OST</div>
        <div class="controls">
            <button class="btn" id="langToggle" aria-label="Language">
                <span class="btn-label" data-i18n="langLabel">RU</span>
            </button>
            <button class="btn" id="themeToggle" aria-label="Theme">
                <span class="theme-icon">◐</span>
            </button>
        </div>
    </header>

    <main class="stage" id="stage"></main>

    <footer class="footer">
        <span data-i18n="footer">© IamNotOst</span>
        <span class="dot">•</span>
        <span id="clock">--:--:--</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
